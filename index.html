<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeProp - Find Your Dream Home</title>

<style>
    /* CSS Variables */
:root {
  --font-size: 14px;
  --background: #ffffff;
  --foreground: #1a1a1a;
  --card: #ffffff;
  --card-foreground: #1a1a1a;
  --primary: #2563eb;
  --primary-foreground: #ffffff;
  --secondary: #f1f5f9;
  --secondary-foreground: #1a1a1a;
  --muted: #ececf0;
  --muted-foreground: #717182;
  --accent: #e9ebef;
  --accent-foreground: #1a1a1a;
  --border: rgba(0, 0, 0, 0.1);
  --input-background: #f3f3f5;
  --radius: 0.625rem;
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: var(--font-size);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
  background-color: var(--background);
  color: var(--foreground);
  line-height: 1.5;
  min-height: 100vh;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 1rem;
}

/* Typography */
h1 {
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1.2;
}

h2 {
  font-size: 1.875rem;
  font-weight: 700;
  line-height: 1.3;
}

h3 {
  font-size: 1.125rem;
  font-weight: 500;
  line-height: 1.4;
}

p {
  font-size: 1rem;
  line-height: 1.5;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  border-radius: var(--radius);
  font-size: 0.875rem;
  font-weight: 500;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-primary {
  background-color: var(--primary);
  color: var(--primary-foreground);
}

.btn-primary:hover {
  background-color: #1d4ed8;
}

.btn-outline {
  background-color: transparent;
  color: var(--foreground);
  border: 1px solid var(--border);
}

.btn-outline:hover {
  background-color: var(--accent);
}

.btn-ghost {
  background-color: transparent;
  color: var(--foreground);
}

.btn-ghost:hover {
  background-color: var(--accent);
}

.btn-close {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0.5rem;
  border-radius: 0.375rem;
  color: var(--muted-foreground);
  transition: background-color 0.2s;
}

.btn-close:hover {
  background-color: var(--accent);
}

/* Navigation */
.navbar {
  border-bottom: 1px solid var(--border);
  background-color: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 40;
}

.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 4rem;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 1rem;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 2rem;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.logo-icon {
  width: 2rem;
  height: 2rem;
  background-color: var(--primary);
  color: white;
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 0.875rem;
}

.logo-text {
  font-size: 1.25rem;
  font-weight: bold;
  color: var(--foreground);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.nav-link {
  color: var(--foreground);
  text-decoration: none;
  transition: color 0.2s;
}

.nav-link:hover {
  color: var(--primary);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.mobile-menu-btn {
  display: none;
}

/* Hero Section */
.hero {
  padding: 4rem 0 6rem;
}

.hero-content {
  text-align: center;
  margin-bottom: 3rem;
}

.hero-title {
  font-size: 3rem;
  font-weight: bold;
  color: var(--foreground);
  margin-bottom: 1.5rem;
}

.text-primary {
  color: var(--primary);
}

.hero-subtitle {
  font-size: 1.25rem;
  color: var(--muted-foreground);
  max-width: 32rem;
  margin: 0 auto;
}

/* Chat Interface */
.chat-container {
  max-width: 64rem;
  margin: 0 auto;
}

.search-mode {
  width: 100%;
}

.search-box {
  background-color: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: 1.5rem;
  box-shadow: var(--shadow-xl);
}

.search-input-container {
  flex: 1;
}

.search-input {
  width: 100%;
  height: 3rem;
  padding: 0 1rem;
  background-color: rgba(255, 255, 255, 0.5);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus {
  border-color: var(--primary);
}

.search-buttons {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}

/* Chat Mode */
.chat-mode {
  background-color: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 1rem;
  box-shadow: var(--shadow-xl);
  display: flex;
  flex-direction: column;
  height: 32rem;
}

.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem;
  border-bottom: 1px solid var(--border);
  background-color: rgba(255, 255, 255, 0.9);
  border-radius: 1rem 1rem 0 0;
}

.chatbot-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.chatbot-avatar {
  width: 2rem;
  height: 2rem;
  background-color: var(--primary);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chatbot-details h3 {
  font-weight: 500;
  color: var(--foreground);
  font-size: 1rem;
  margin: 0;
}

.chatbot-details p {
  font-size: 0.75rem;
  color: var(--muted-foreground);
  margin: 0;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  background-color: rgba(250, 252, 255, 0.5);
}

.chat-input-area {
  padding: 1rem;
  border-top: 1px solid var(--border);
  background-color: rgba(255, 255, 255, 0.9);
  border-radius: 0 0 1rem 1rem;
}

/* Properties Section */
.properties-section {
  padding: 4rem 0;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
}

.section-title {
  font-size: 1.875rem;
  font-weight: bold;
  color: var(--foreground);
}

.properties-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
}

/* Property Cards */
.property-card {
  background-color: var(--card);
  border-radius: 0.75rem;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: all 0.3s ease;
  cursor: pointer;
}

.property-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

.property-image {
  width: 100%;
  height: 12rem;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.property-card:hover .property-image {
  transform: scale(1.05);
}

.property-content {
  padding: 1rem;
}

.property-title {
  font-weight: 500;
  color: var(--foreground);
  margin-bottom: 0.5rem;
  transition: color 0.2s;
}

.property-card:hover .property-title {
  color: var(--primary);
}

.property-location {
  display: flex;
  align-items: center;
  color: var(--muted-foreground);
  font-size: 0.875rem;
  margin-bottom: 0.5rem;
}

.property-location i {
  margin-right: 0.25rem;
}

.property-details {
  display: flex;
  align-items: center;
  gap: 1rem;
  color: var(--muted-foreground);
  font-size: 0.875rem;
  margin-bottom: 0.5rem;
}

.property-detail {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.property-price {
  color: var(--primary);
  font-weight: 500;
  font-size: 1.125rem;
}

.badge {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  background-color: var(--primary);
  color: white;
  padding: 0.25rem 0.5rem;
  border-radius: 0.375rem;
  font-size: 0.75rem;
  font-weight: 500;
}

/* Message Styles */
.message {
  display: flex;
  gap: 0.5rem;
  animation: fadeIn 0.3s ease;
}

.message.user {
  flex-direction: row-reverse;
}

.message-avatar {
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.message-avatar.user {
  background-color: var(--primary);
  color: white;
}

.message-avatar.bot {
  background-color: var(--primary);
  color: white;
}

.message-content {
  max-width: 80%;
}

.message-bubble {
  padding: 0.75rem;
  border-radius: 1rem;
  font-size: 0.875rem;
  line-height: 1.4;
}

.message.user .message-bubble {
  background-color: var(--primary);
  color: white;
  margin-left: auto;
}

.message.bot .message-bubble {
  background-color: var(--muted);
  color: var(--foreground);
}

.input-container {
  display: flex;
  gap: 0.5rem;
}

.chat-input {
  flex: 1;
  padding: 0.75rem 1rem;
  background-color: rgba(255, 255, 255, 0.5);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  font-size: 0.875rem;
}

.chat-input:focus {
  border-color: var(--primary);
}

.send-btn {
  padding: 0.75rem;
  background-color: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background-color 0.2s;
  min-width: 3rem;
}

.send-btn:hover {
  background-color: #1d4ed8;
}

/* Typing Indicator */
.typing-indicator {
  display: inline-block;
  padding: 0.75rem;
  background-color: var(--muted);
  border-radius: 1rem;
  font-size: 0.875rem;
  color: var(--muted-foreground);
  font-style: italic;
}

.typing-indicator::after {
  content: "...";
  animation: dots 1.5s steps(5, end) infinite;
}

@keyframes dots {
  0%, 20% { content: "."; }
  40% { content: ".."; }
  60%, 100% { content: "..."; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Property Cards in Chat */
.chat-property-card {
  background-color: var(--card);
  border-radius: 0.5rem;
  overflow: hidden;
  border: 1px solid var(--border);
  margin-top: 0.75rem;
  width: 18rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.chat-property-card:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
}

.chat-property-image {
  width: 100%;
  height: 8rem;
  object-fit: cover;
}

.chat-property-content {
  padding: 0.75rem;
}

.chat-property-title {
  font-weight: 500;
  font-size: 0.875rem;
  margin-bottom: 0.25rem;
}

.chat-property-location {
  display: flex;
  align-items: center;
  color: var(--muted-foreground);
  font-size: 0.75rem;
  margin-bottom: 0.25rem;
}

.chat-property-details {
  display: flex;
  gap: 0.75rem;
  color: var(--muted-foreground);
  font-size: 0.75rem;
  margin-bottom: 0.25rem;
}

.chat-property-price {
  color: var(--primary);
  font-weight: 500;
  font-size: 1rem;
}

/* Responsive Design */
@media (max-width: 768px) {
  .nav-links {
    display: none;
  }
  
  .mobile-menu-btn {
    display: flex;
  }
  
  .hero-title {
    font-size: 2rem;
  }
  
  .search-box {
    padding: 1rem;
  }
  
  .search-buttons {
    flex-direction: column;
  }
  
  .section-header {
    flex-direction: column;
    gap: 1rem;
    align-items: flex-start;
  }
  
  .chat-mode {
    height: 28rem;
  }
}

@media (min-width: 768px) {
  .search-box {
    display: flex;
    gap: 1rem;
    align-items: flex-end;
  }
  
  .search-buttons {
    margin-top: 0;
    flex-shrink: 0;
  }
}

@media (min-width: 1024px) {
  .hero-title {
    font-size: 3.75rem;
  }
  
  .properties-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>

// DOM elements
const propertiesGrid = document.getElementById('propertiesGrid');

// State
let isInChatMode = false;

// API Configuration
async function getApiUrl() {
    try {
        let text = await (await fetch("./deploy/public_api")).text();
        let url = text.match(/https:\/\/[a-z0-9.-]+\.trycloudflare\.com/)[0];
        return url + "/model/generate/";
    } catch (error) {
        console.warn('Could not fetch API URL, using fallback');
        return null; // Will trigger mock response
    }
}

// Initialize the application
function init() {
    renderProperties();
    setupEventListeners();
    showWelcomeMessage();
}

// Render properties grid
function renderProperties() {
    propertiesGrid.innerHTML = properties.map((property, index) => 
        createPropertyCard(property)
    ).join('');
}

// Create property card HTML
function createPropertyCard(property, isCompact = false) {
    return `
        <div class="property-card ${isCompact ? 'chat-property-card' : ''}">
            <div style="position: relative;">
                <img 
                    src="${property.imageUrl}" 
                    alt="${property.title}"
                    class="${isCompact ? 'chat-property-image' : 'property-image'}"
                    loading="lazy"
                />
                ${property.isNew ? '<div class="badge">New</div>' : ''}
            </div>
            <div class="${isCompact ? 'chat-property-content' : 'property-content'}">
                <h3 class="${isCompact ? 'chat-property-title' : 'property-title'}">${property.title}</h3>
                <div class="${isCompact ? 'chat-property-location' : 'property-location'}">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>${property.location}</span>
                </div>
                <div class="${isCompact ? 'chat-property-details' : 'property-details'}">
                    <div class="property-detail">
                        <i class="fas fa-bed"></i>
                        <span>${property.beds}</span>
                    </div>
                    <div class="property-detail">
                        <i class="fas fa-bath"></i>
                        <span>${property.baths}</span>
                    </div>
                    <div class="property-detail">
                        <i class="fas fa-vector-square"></i>
                        <span>${property.area}</span>
                    </div>
                </div>
                <div class="${isCompact ? 'chat-property-price' : 'property-price'}">
                    ${property.price}
                </div>
            </div>
        </div>
    `;
}

// Show welcome message when page loads
function showWelcomeMessage() {
    // Add a subtle hint in the search placeholder
    searchInput.placeholder = "Ask me about properties... (e.g., 'Show me 2BHK apartments under 50 lakhs in Bangalore')";
}

// Switch to chat mode
function switchToChatMode(initialMessage) {
    isInChatMode = true;
    searchMode.style.display = 'none';
    chatMode.style.display = 'flex';
    
    // Add initial message if provided
    if (initialMessage) {
        addMessage('user', initialMessage);
        // Simulate bot response or make API call
        handleBotResponse(initialMessage);
    }
    
    chatInput.focus();
}

// Switch back to search mode
function switchToSearchMode() {
    isInChatMode = false;
    chatMode.style.display = 'none';
    searchMode.style.display = 'block';
    
    // Clear messages and reset
    messages = [];
    chatMessages.innerHTML = '';
    searchInput.value = '';
    chatInput.value = '';
    searchInput.focus();
}

// Setup event listeners
function setupEventListeners() {
    // Search mode events
    searchSendBtn.addEventListener('click', () => {
        const message = searchInput.value.trim();
        if (message) {
            switchToChatMode(message);
            searchInput.value = '';
        }
    });

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const message = searchInput.value.trim();
            if (message) {
                switchToChatMode(message);
                searchInput.value = '';
            }
        }
    });

    // Chat mode events
    chatSendBtn.addEventListener('click', () => {
        sendChatMessage();
    });

    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendChatMessage();
        }
    });

    // Back to search
    backToSearch.addEventListener('click', () => {
        switchToSearchMode();
    });

    // Property card clicks
    document.addEventListener('click', (e) => {
        const propertyCard = e.target.closest('.property-card');
        if (propertyCard) {
            console.log('Property card clicked');
            // Handle property card click - could open details modal, etc.
        }
    });
}

// Send chat message
function sendChatMessage() {
    const message = chatInput.value.trim();
    if (!message) return;

    addMessage('user', message);
    chatInput.value = '';
    
    // Handle bot response
    handleBotResponse(message);
}

// Add message to chat
function addMessage(sender, text, properties = null) {
    const messageId = Date.now().toString();
    const message = {
        id: messageId,
        type: sender,
        content: text,
        properties: properties
    };

    messages.push(message);
    renderMessage(message);
    scrollToBottom();
}

// Render a single message
function renderMessage(message) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${message.type}`;
    messageDiv.innerHTML = createMessageHTML(message);
    chatMessages.appendChild(messageDiv);
}

// Create message HTML
function createMessageHTML(message) {
    const isUser = message.type === 'user';
    const avatarIcon = isUser ? 'fas fa-user' : 'fas fa-robot';
    
    let propertiesHTML = '';
    if (message.properties && message.properties.length > 0) {
        propertiesHTML = `
            <div style="margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem;">
                ${message.properties.map(property => createPropertyCard(property, true)).join('')}
                <p style="font-size: 0.75rem; color: var(--muted-foreground); margin-top: 0.5rem;">
                    Would you like to see more properties or refine your search?
                </p>
            </div>
        `;
    }
    
    return `
        <div class="message-avatar ${isUser ? 'user' : 'bot'}">
            <i class="${avatarIcon}"></i>
        </div>
        <div class="message-content">
            <div class="message-bubble">
                ${message.content}
            </div>
            ${propertiesHTML}
        </div>
    `;
}

// Add typing indicator
function addTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `
        <div class="message-avatar bot">
            <i class="fas fa-robot"></i>
        </div>
        <div class="message-content">
            <div class="typing-indicator">PrimeProp AI is thinking</div>
        </div>
    `;
    chatMessages.appendChild(typingDiv);
    scrollToBottom();
}

// Remove typing indicator
function removeTypingIndicator() {
    const typingIndicator = document.getElementById('typingIndicator');
    if (typingIndicator) {
        typingIndicator.remove();
    }
}

// Handle bot response
async function handleBotResponse(userMessage) {
    addTypingIndicator();

    try {
        const API_URL = await getApiUrl();
        
        if (API_URL) {
            // Use real API
            await handleRealApiResponse(userMessage, API_URL);
        } else {
            // Use mock response
            await handleMockResponse(userMessage);
        }
    } catch (error) {
        console.error('Error handling bot response:', error);
        removeTypingIndicator();
        addMessage('bot', 'Sorry, I encountered an error. Please try again.');
    }
}

// Handle real API response
async function handleRealApiResponse(userMessage, apiUrl) {
    try {
        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                prompt: `You are a helpful real estate assistant. User asked: "${userMessage}". Please provide a helpful response about properties.`,
                max_new_tokens: 1024 
            })
        });

        if (!response.ok) {
            throw new Error('API request failed');
        }

        removeTypingIndicator();

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let botMessage = '';
        let messageId = null;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            botMessage += decoder.decode(value);
            
            if (!messageId) {
                // Create initial message
                const message = {
                    id: Date.now().toString(),
                    type: 'bot',
                    content: botMessage,
                    properties: null
                };
                messages.push(message);
                messageId = message.id;
                renderMessage(message);
            } else {
                // Update existing message
                updateLastBotMessage(botMessage);
            }
        }

        // Add sample properties if the message seems to be about property search
        if (isPropertySearchQuery(userMessage)) {
            setTimeout(() => {
                const propertiesMessage = {
                    id: Date.now().toString(),
                    type: 'bot',
                    content: 'Here are some properties that match your criteria:',
                    properties: samplePropertyResponses.slice(0, 2)
                };
                messages.push(propertiesMessage);
                renderMessage(propertiesMessage);
                scrollToBottom();
            }, 1000);
        }

    } catch (error) {
        console.error('Real API error:', error);
        removeTypingIndicator();
        await handleMockResponse(userMessage);
    }
}

// Handle mock response for demo purposes
async function handleMockResponse(userMessage) {
    await new Promise(resolve => setTimeout(resolve, 1500)); // Simulate thinking time
    removeTypingIndicator();

    if (isPropertySearchQuery(userMessage)) {
        addMessage('bot', 'I found some great properties that match your criteria! Here are the top matches:');
        
        // Add properties after a short delay
        setTimeout(() => {
            const propertiesMessage = {
                id: Date.now().toString(),
                type: 'bot',
                content: '',
                properties: samplePropertyResponses.slice(0, 2)
            };
            messages.push(propertiesMessage);
            renderMessage(propertiesMessage);
            scrollToBottom();
        }, 500);
    } else {
        const responses = [
            "I'd be happy to help with your medical questions! Could you tell me more about your symptoms or concerns?",
            "I can help you understand medical conditions and connect with appropriate specialists. What would you like to know?",
            "Great question! I can provide medical information and help you find doctors. What health topic are you interested in?",
            "I'm here to assist with your healthcare needs. Feel free to ask about symptoms, treatments, or finding doctors."
        ];
        
        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
        addMessage('bot', randomResponse);
    }
}

// Check if message is about property search
function isPropertySearchQuery(message) {
    const keywords = ['bhk', 'apartment', 'flat', 'house', 'villa', 'property', 'lakhs', 'crores', 'bangalore', 'rent', 'buy', 'bedroom', 'budget'];
    return keywords.some(keyword => message.toLowerCase().includes(keyword));
}

// Update last bot message (for streaming)
function updateLastBotMessage(text) {
    const botMessages = chatMessages.querySelectorAll('.message.bot');
    if (botMessages.length > 0) {
        const lastMessage = botMessages[botMessages.length - 1];
        const messageBubble = lastMessage.querySelector('.message-bubble');
        if (messageBubble) {
            messageBubble.textContent = text;
            scrollToBottom();
        }
    }
}

// Scroll to bottom of chat
function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

// Add intersection observer for animations
const observerOptions = {
    threshold: 0.1,
    rootMargin: '0px 0px -50px 0px'
};

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
        }
    });
}, observerOptions);

// Observe property cards for scroll animations
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        const propertyCards = document.querySelectorAll('.property-card');
        propertyCards.forEach((card, index) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            card.style.transitionDelay = `${index * 0.1}s`;
            observer.observe(card);
        });
    }, 100);
});
