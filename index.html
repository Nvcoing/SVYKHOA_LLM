<style>
:root {
  --font-size: 14px;
  --background: #f8fafc;
  --foreground: #1a1a1a;
  --card: #ffffff;
  --card-foreground: #1a1a1a;
  --primary: #2563eb;
  --primary-foreground: #ffffff;
  --secondary: #f1f5f9;
  --secondary-foreground: #1a1a1a;
  --muted: #ececf0;
  --muted-foreground: #717182;
  --accent: #e9ebef;
  --accent-foreground: #1a1a1a;
  --border: rgba(0, 0, 0, 0.1);
  --input-background: #f3f3f5;
  --radius: 0.75rem;
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: var(--font-size);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
  background-color: var(--background);
  color: var(--foreground);
  line-height: 1.5;
  min-height: 100vh;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 1rem;
}

h1 {
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1.2;
}

h2 {
  font-size: 1.875rem;
  font-weight: 700;
  line-height: 1.3;
}

h3 {
  font-size: 1.125rem;
  font-weight: 500;
  line-height: 1.4;
}

p {
  font-size: 1rem;
  line-height: 1.5;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.625rem 1.25rem;
  border-radius: var(--radius);
  font-size: 0.875rem;
  font-weight: 500;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-primary {
  background-color: var(--primary);
  color: var(--primary-foreground);
}

.btn-primary:hover {
  background-color: #1d4ed8;
  transform: translateY(-1px);
  box-shadow: var(--shadow-lg);
}

.btn-close {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--border);
  cursor: pointer;
  padding: 0.5rem;
  border-radius: 0.5rem;
  color: var(--foreground);
  transition: all 0.2s;
  width: 2.5rem;
  height: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-close:hover {
  background-color: var(--accent);
  transform: scale(1.05);
}

.navbar {
  border-bottom: 1px solid var(--border);
  background-color: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 40;
}

.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 4rem;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 1rem;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 2rem;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.logo-text {
  font-size: 1.25rem;
  font-weight: bold;
  color: var(--foreground);
}

.hero {
  padding: 4rem 0 6rem;
  transition: opacity 0.3s ease;
}

.hero.hidden {
  opacity: 0;
  pointer-events: none;
}

.hero-content {
  text-align: center;
  margin-bottom: 3rem;
}

.hero-title {
  font-size: 3rem;
  font-weight: bold;
  color: var(--foreground);
  margin-bottom: 1.5rem;
}

.text-primary {
  color: var(--primary);
}

.hero-subtitle {
  font-size: 1.25rem;
  color: var(--muted-foreground);
  max-width: 32rem;
  margin: 0 auto;
}

.chat-container {
  max-width: 64rem;
  margin: 0 auto;
}

.search-mode {
  width: 100%;
  transition: all 0.3s ease;
}

.search-box {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.85) 100%);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 1.5rem;
  padding: 2rem;
  box-shadow: var(--shadow-xl);
  transition: all 0.3s ease;
}

.search-box:hover {
  box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
  transform: translateY(-2px);
}

.search-input-container {
  flex: 1;
}

.search-input {
  width: 100%;
  height: 3.5rem;
  padding: 0 1.5rem;
  background-color: rgba(255, 255, 255, 0.7);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 1rem;
  outline: none;
  transition: all 0.2s;
}

.search-input:focus {
  border-color: var(--primary);
  background-color: white;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.search-buttons {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}

/* Chat Mode - Fullscreen */
.chat-mode {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: var(--background);
  z-index: 50;
  display: none;
  flex-direction: column;
  animation: slideIn 0.3s ease;
}

.chat-mode.active {
  display: flex;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.95) 100%);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
}

.chatbot-info {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.chatbot-avatar {
  width: 3rem;
  height: 3rem;
  background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  box-shadow: var(--shadow-lg);
}

.chatbot-details h3 {
  font-weight: 600;
  color: var(--foreground);
  font-size: 1.125rem;
  margin: 0;
}

.chatbot-details p {
  font-size: 0.875rem;
  color: var(--muted-foreground);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.status-dot {
  width: 0.5rem;
  height: 0.5rem;
  background-color: #22c55e;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}

.chat-messages::-webkit-scrollbar {
  width: 8px;
}

.chat-messages::-webkit-scrollbar-track {
  background: transparent;
}

.chat-messages::-webkit-scrollbar-thumb {
  background: var(--muted);
  border-radius: 4px;
}

.chat-messages::-webkit-scrollbar-thumb:hover {
  background: var(--muted-foreground);
}

.chat-input-area {
  padding: 1.5rem 2rem;
  border-top: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.98) 100%);
  backdrop-filter: blur(12px);
}

.input-wrapper {
  max-width: 900px;
  margin: 0 auto;
}

.message {
  display: flex;
  gap: 0.75rem;
  animation: fadeIn 0.4s ease;
  max-width: 85%;
}

.message.user {
  flex-direction: row-reverse;
  margin-left: auto;
}

.message-avatar {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1rem;
}

.message-avatar.user {
  background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
  color: white;
  box-shadow: var(--shadow);
}

.message-avatar.bot {
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  color: white;
  box-shadow: var(--shadow);
}

.message-content {
  flex: 1;
}

.message-bubble {
  padding: 1rem 1.25rem;
  border-radius: 1.25rem;
  font-size: 0.9375rem;
  line-height: 1.6;
  box-shadow: var(--shadow);
}

.message.user .message-bubble {
  background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
  color: white;
  border-bottom-right-radius: 0.25rem;
}

.message.bot .message-bubble {
  background-color: white;
  color: var(--foreground);
  border: 1px solid var(--border);
  border-bottom-left-radius: 0.25rem;
}

.message-bubble h1,
.message-bubble h2,
.message-bubble h3,
.message-bubble h4,
.message-bubble h5,
.message-bubble h6 {
  margin: 0.5rem 0;
  font-weight: 600;
}

.message-bubble h1 { font-size: 1.25rem; }
.message-bubble h2 { font-size: 1.125rem; }
.message-bubble h3 { font-size: 1rem; }

.message-bubble p {
  margin: 0.5rem 0;
}

.message-bubble ul,
.message-bubble ol {
  margin: 0.5rem 0;
  padding-left: 1.5rem;
}

.message-bubble li {
  margin: 0.25rem 0;
}

.message-bubble code {
  background-color: rgba(0, 0, 0, 0.1);
  padding: 0.125rem 0.375rem;
  border-radius: 0.25rem;
  font-family: 'Courier New', monospace;
  font-size: 0.875rem;
}

.message-bubble pre {
  background-color: rgba(0, 0, 0, 0.05);
  padding: 1rem;
  border-radius: 0.5rem;
  overflow-x: auto;
  margin: 0.75rem 0;
}

.message-bubble pre code {
  background-color: transparent;
  padding: 0;
}

.input-container {
  display: flex;
  gap: 0.75rem;
  align-items: center;
}

.chat-input {
  flex: 1;
  padding: 1rem 1.25rem;
  background-color: white;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  font-size: 0.9375rem;
  transition: all 0.2s;
}

.chat-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.send-btn {
  padding: 1rem;
  background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
  color: white;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  min-width: 3.5rem;
  height: 3.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-lg);
}

.send-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-xl);
}

.send-btn:active {
  transform: translateY(0);
}

.typing-indicator {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 1rem 1.25rem;
  background-color: white;
  border: 1px solid var(--border);
  border-radius: 1.25rem;
  font-size: 0.9375rem;
  color: var(--muted-foreground);
  box-shadow: var(--shadow);
}

.typing-dots {
  display: flex;
  gap: 0.25rem;
}

.typing-dot {
  width: 0.5rem;
  height: 0.5rem;
  background-color: var(--primary);
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out;
}

.typing-dot:nth-child(1) {
  animation-delay: -0.32s;
}

.typing-dot:nth-child(2) {
  animation-delay: -0.16s;
}

@keyframes bounce {
  0%, 80%, 100% {
    transform: scale(0);
    opacity: 0.5;
  }
  40% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes fadeIn {
  from { 
    opacity: 0; 
    transform: translateY(10px); 
  }
  to { 
    opacity: 1; 
    transform: translateY(0); 
  }
}

.properties-section {
  padding: 4rem 0;
}

.reference-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0.2;
  transition: opacity 0.4s;
  pointer-events: none;
}

.reference-block.visible {
  opacity: 1;
  pointer-events: auto;
}

.reference-title {
  text-align: center;
  font-size: 2rem;
  font-weight: bold;
  color: var(--foreground);
  margin-bottom: 2rem;
}

.properties-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
}

.property-card {
  background-color: var(--card);
  border-radius: 0.75rem;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: all 0.3s ease;
  cursor: pointer;
}

.property-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

.property-image {
  width: 100%;
  height: 12rem;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.property-card:hover .property-image {
  transform: scale(1.05);
}

.property-content {
  padding: 1rem;
}

.property-title {
  font-weight: 500;
  color: var(--foreground);
  margin-bottom: 0.5rem;
  transition: color 0.2s;
}

.property-card:hover .property-title {
  color: var(--primary);
}

.property-location {
  display: flex;
  align-items: center;
  color: var(--muted-foreground);
  font-size: 0.875rem;
  margin-bottom: 0.5rem;
}

.property-location i {
  margin-right: 0.25rem;
}

.property-details {
  display: flex;
  align-items: center;
  gap: 1rem;
  color: var(--muted-foreground);
  font-size: 0.875rem;
  margin-bottom: 0.5rem;
}

.property-detail {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.property-price {
  color: var(--primary);
  font-weight: 500;
  font-size: 1.125rem;
}

@media (max-width: 768px) {
  .hero-title {
    font-size: 2rem;
  }
  
  .chat-messages {
    padding: 1rem;
  }
  
  .chat-header {
    padding: 1rem;
  }
  
  .chat-input-area {
    padding: 1rem;
  }
  
  .message {
    max-width: 90%;
  }
}
</style>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo">
                    <img src="https://github.com/Nvcoing/SVYKHOA_LLM/blob/main/doc/logo/logo.png?raw=true" alt="AgentSV Logo" width="32" height="32">
                    <span class="logo-text">AgentSV Việt Nam</span>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero" id="heroSection">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">
                    Kết nối với

                </h1>
                <p class="hero-subtitle">

            <div class="chat-container" id="chatContainer">

                        <div class="search-buttons">

    </section>

    <div class="chat-mode" id="chatMode">
        <div class="chat-header">
            <div class="chatbot-info">
                <div class="chatbot-avatar">
                    <i class="fas fa-plus"></i>
                </div>
                <div class="chatbot-details">
                    <h3>AgentSV Medical Assistant</h3>

                        <span class="status-dot"></span>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <div class="input-container">
                    <input 
                        type="text" 
                        placeholder="Nhập câu hỏi của bạn..."

                        id="chatInput"
                    />
                    <button class="btn btn-primary send-btn" id="chatSendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <section class="properties-section">

            <h2 class="reference-title">Tài liệu tham khảo</h2>
            <div class="properties-grid" id="propertiesGrid"></div>

        const sampleDoctorResponses = [
            {

        const propertiesGrid = document.getElementById('propertiesGrid');
        const heroSection = document.getElementById('heroSection');
        const searchMode = document.getElementById('searchMode');
        const chatMode = document.getElementById('chatMode');
        const searchInput = document.getElementById('searchInput');
        const searchSendBtn = document.getElementById('searchSendBtn');
        const backToSearch = document.getElementById('backToSearch');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const stopResponseBtn = document.getElementById('stopResponseBtn');

        let isInChatMode = false;
        let messages = [];

        // Thêm biến trạng thái phản hồi
        let isBotResponding = false;

        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true,
                sanitize: false,
                smartLists: true,
                smartypants: false
            });
        }

        function init() {
            renderDoctors();
            setupEventListeners();
        }

        function renderDoctors() {
            propertiesGrid.innerHTML = doctors.map(doctor => 
                createDoctorCard(doctor)
            ).join('');
        }

        function createDoctorCard(doctor) {
            return `
                <div class="property-card">
                    <div style="position: relative;">
                        <img 
                            src="${doctor.imageUrl}" 
                            alt="${doctor.title}"
                            class="property-image"
                            loading="lazy"
                        />
                    </div>
                    <div class="property-content">
                        <h3 class="property-title">${doctor.title}</h3>
                        <div class="property-location">
                            <i class="fas fa-hospital"></i>
                            <span>${doctor.location}</span>
                        </div>
                        <div class="property-details">
                            <div class="property-detail">
                                <i class="fas fa-clock"></i>
                                <span>${doctor.beds}</span>
                            </div>
                            <div class="property-detail">
                                <i class="fas fa-language"></i>
                                <span>${doctor.baths}</span>
                            </div>
                            <div class="property-detail">
                                <i class="fas fa-certificate"></i>
                                <span>${doctor.area}</span>
                            </div>
                        </div>
                        <div class="property-price">
                            ${doctor.price}
                        </div>
                    </div>
                </div>
            `;
        }

        function switchToChatMode(initialMessage) {
            isInChatMode = true;
            heroSection.classList.add('hidden');
            chatMode.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            if (initialMessage) {
                addMessage('user', initialMessage);
                handleBotResponse(initialMessage);
            }
            
            chatInput.focus();
        }

        function switchToSearchMode() {
            isInChatMode = false;
            chatMode.classList.remove('active');
            heroSection.classList.remove('hidden');
            document.body.style.overflow = 'auto';
            
            messages = [];
            chatMessages.innerHTML = '';
            searchInput.value = '';
            chatInput.value = '';
            
            setTimeout(() => {
                searchInput.focus();
            }, 300);
        }

        function setupEventListeners() {
            searchSendBtn.addEventListener('click', () => {
                const message = searchInput.value.trim();
                if (message) {
                    switchToChatMode(message);
                    searchInput.value = '';
                }
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const message = searchInput.value.trim();
                    if (message) {
                        switchToChatMode(message);
                        searchInput.value = '';
                    }
                }
            });

            chatSendBtn.addEventListener('click', () => {
                sendChatMessage();
            });

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendChatMessage();
                }
            });

            backToSearch.addEventListener('click', () => {
                switchToSearchMode();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isInChatMode) {
                    switchToSearchMode();
                }
            });

            // Sửa lại hàm setSendButtonState để hiển thị nút dừng khi bot đang trả lời
            function setSendButtonState(isResponding) {
                if (isResponding) {
                    chatSendBtn.style.display = 'none';
                    stopResponseBtn.style.display = 'inline-flex';
                    chatInput.disabled = true; // Không thể chat khi bot đang trả lời
                } else {
                    chatSendBtn.style.display = 'inline-flex';
                    stopResponseBtn.style.display = 'none';
                    chatInput.disabled = false;
                }
            }

            // Thêm sự kiện cho nút dừng trả lời
            stopResponseBtn.addEventListener('click', () => {
                stopBotResponse = true;
                setSendButtonState(false);
            });
        }

        // Sửa lại các hàm liên quan đến gửi chat
        function sendChatMessage() {
            if (isBotResponding) return; // Không cho gửi khi bot đang trả lời
            const message = chatInput.value.trim();
            if (!message) return;

            addMessage('user', message);
            chatInput.value = '';
            
            handleBotResponse(message);
        }

        function addMessage(sender, text, doctors = null) {
            const messageId = Date.now().toString();
            const message = {
                id: messageId,
                type: sender,
                content: text,
                doctors: doctors
            };

            messages.push(message);
            renderMessage(message);
            scrollToBottom();
        }

        function renderMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.type}`;
            messageDiv.innerHTML = createMessageHTML(message);
            chatMessages.appendChild(messageDiv);
        }

        function createMessageHTML(message) {
            const isUser = message.type === 'user';
            const avatarIcon = isUser ? 'fas fa-user' : 'fas fa-user-md';
            
            let content = message.content;
            
            if (!isUser && typeof marked !== 'undefined' && content) {
                try {
                    content = marked.parse(content);
                } catch (error) {
                    console.error('Markdown parsing error:', error);
                    content = content
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/`(.*?)`/g, '<code>$1</code>')
                        .replace(/\n/g, '<br>');
                }
            }
            
            return `
                <div class="message-avatar ${isUser ? 'user' : 'bot'}">
                    <i class="${avatarIcon}"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble">
                        ${content}
                    </div>
                </div>
            `;
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar bot">
                    <i class="fas fa-user-md"></i>
                </div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span>Đang suy nghĩ</span>
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        async function getApiUrl() {
            try {
                let text = await (await fetch("./deploy/public_api")).text();
                let url = text.match(/https:\/\/[a-z0-9.-]+\.trycloudflare\.com/)[0];
                return url + "/model/generate/";
            } catch (error) {
                console.warn('Could not fetch API URL, using fallback');
                return null;
            }
        }

        // Khi bắt đầu phản hồi bot
        async function handleBotResponse(userMessage) {
            isBotResponding = true;
            chatInput.disabled = true; // Không gõ được khi bot trả lời
            addTypingIndicator();

            try {
                const API_URL = await getApiUrl();
                
                if (API_URL) {
                    await handleRealApiResponse(userMessage, API_URL);
                } else {
                    await handleMockResponse(userMessage);
                }
            } catch (error) {
                console.error('Error handling bot response:', error);
                removeTypingIndicator();
                addMessage('bot', 'Xin lỗi, tôi gặp lỗi. Vui lòng thử lại.');
            } finally {
                isBotResponding = false;
                chatInput.disabled = false; // Cho phép gõ lại khi bot trả lời xong
                removeTypingIndicator();
            }
        }

        async function handleRealApiResponse(userMessage, apiUrl) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: userMessage,
                        max_new_tokens: 1024 
                    })
                });

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                removeTypingIndicator();

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let botMessage = '';
                let messageId = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    botMessage += decoder.decode(value);
                    
                    if (!messageId) {
                        const message = {
                            id: Date.now().toString(),
                            type: 'bot',
                            content: botMessage,
                            doctors: null
                        };
                        messages.push(message);
                        messageId = message.id;
                        renderMessage(message);
                    } else {
                        updateLastBotMessage(botMessage);
                    }
                }

                if (isDoctorSearchQuery(userMessage)) {
                    setTimeout(() => {
                        const doctorsMessage = {
                            id: Date.now().toString(),
                            type: 'bot',
                            content: 'Here are some doctors that might help you:',
                            doctors: sampleDoctorResponses
                        };
                        messages.push(doctorsMessage);
                        renderMessage(doctorsMessage);
                        scrollToBottom();
                    }, 1000);
                }

            } catch (error) {
                console.error('Real API error:', error);
                removeTypingIndicator();
                await handleMockResponse(userMessage);
            }
        }

        async function handleMockResponse(userMessage) {
            await new Promise(resolve => setTimeout(resolve, 1500));
            removeTypingIndicator();

            if (isDoctorSearchQuery(userMessage)) {
                addMessage('bot', 'Tôi đã tìm thấy một số chuyên gia có thể giúp bạn! Đây là những lựa chọn phù hợp nhất:');
                
                setTimeout(() => {
                    const doctorsMessage = {
                        id: Date.now().toString(),
                        type: 'bot',
                        content: '',
                        doctors: sampleDoctorResponses
                    };
                    messages.push(doctorsMessage);
                    renderMessage(doctorsMessage);
                    scrollToBottom();
                }, 500);
            } else {
                const responses = [
                    "Tôi rất vui được hỗ trợ bạn với các câu hỏi y tế! Bạn có thể chia sẻ thêm về triệu chứng hoặc mối quan tâm của mình không?\n\n**Lưu ý:** Thông tin này chỉ mang tính chất tham khảo và không thay thế cho tư vấn y tế chuyên nghiệp.",
                    "Tôi có thể giúp bạn hiểu về các tình trạng y tế và kết nối với các chuyên gia phù hợp. Bạn muốn biết điều gì?\n\n**Dịch vụ có sẵn:**\n- Đánh giá triệu chứng\n- Giới thiệu bác sĩ\n- Thông tin sức khỏe\n- Đặt lịch hẹn",
                    "Câu hỏi hay! Tôi có thể cung cấp thông tin y tế và giúp bạn tìm bác sĩ. Bạn quan tâm đến chủ đề sức khỏe nào?\n\n**Nhớ rằng:** Luôn tham khảo ý kiến của chuyên gia y tế để có chẩn đoán và điều trị chính xác.",
                    "Tôi ở đây để hỗ trợ nhu cầu chăm sóc sức khỏe của bạn. Vui lòng hỏi về:\n\n1. **Triệu chứng** và tình trạng\n2. **Điều trị** và thuốc men\n3. **Tìm chuyên gia**\n4. **Đặt lịch hẹn**"
                ];
                
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                addMessage('bot', randomResponse);
            }
        }

        function isDoctorSearchQuery(message) {
            const keywords = ['doctor', 'specialist', 'bác sĩ', 'chuyên gia', 'tìm', 'recommend', 'appointment', 'consultation', 'khám'];
            return keywords.some(keyword => message.toLowerCase().includes(keyword));
        }

        function updateLastBotMessage(text) {
            const botMessages = chatMessages.querySelectorAll('.message.bot');
            if (botMessages.length > 0) {
                const lastMessage = botMessages[botMessages.length - 1];
                const messageBubble = lastMessage.querySelector('.message-bubble');
                if (messageBubble) {
                    if (typeof marked !== 'undefined') {
                        try {
                            messageBubble.innerHTML = marked.parse(text);
                        } catch (error) {
                            messageBubble.textContent = text;
                        }
                    } else {
                        messageBubble.textContent = text;
                    }
                    scrollToBottom();
                }
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', init);

        document.addEventListener('DOMContentLoaded', () => {
            const images = document.querySelectorAll('img');
            images.forEach(img => {
                img.addEventListener('error', (e) => {
                    e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgdmlld0JveD0iMCAwIDQwMCAzMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSI0MDAiIGhlaWdodD0iMzAwIiBmaWxsPSIjRjNGM0Y1Ii8+CjxjaXJjbGUgY3g9IjIwMCIgY3k9IjE1MCIgcj0iNDAiIGZpbGw9IiM3QjdCOEIiLz4KPHRleHQgeD0iMjAwIiB5PSIyMDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM3QjdCOEIiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZm9udC13ZWlnaHQ9IjUwMCI+RG9jdG9yIFBob3RvPC90ZXh0Pgo8L3N2Zz4=';
                });
            });
        });

        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const doctorCards = document.querySelectorAll('.property-card');
                doctorCards.forEach((card, index) => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                    card.style.transitionDelay = `${index * 0.1}s`;
                    observer.observe(card);
                });
            }, 100);
        });

        document.addEventListener('DOMContentLoaded', function() {
            const refBlock = document.getElementById('reference-block');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 400) {
                    refBlock.classList.add('visible');
                } else {
                    refBlock.classList.remove('visible');
                }
            });
        });
    </script>
</body>
</html>
